name: Publish Chess Atelier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp this GitHub build for the in-app updater
        shell: bash
        run: |
          build="${GITHUB_SHA::7}"
          version="$(sed -n "s/.*VERSION='\\([^']*\\)'.*/\\1/p" dist/app.js)"
          sed -i "s/BUILD_ID='source'/BUILD_ID='${build}'/" dist/app.js
          sed -i "s/atelier-v0.2.0/atelier-v0.2.0-${build}/" dist/sw.js
          printf '{"version":"%s","build":"%s","githubConnected":true}' "$version" "$build" > dist/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
